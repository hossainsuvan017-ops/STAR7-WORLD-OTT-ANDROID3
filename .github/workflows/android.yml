name: STAR 7 WORLD OTT - Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use uploaded STAR 7 logo as Android app icon
        run: |
          test -f app/src/main/assets/logo.png || { echo "ERROR: Upload app/src/main/assets/logo.png first"; exit 1; }
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/assets/logo.png app/src/main/res/drawable-nodpi/star7_app_icon.png
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: STAR7-WORLD-OTT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
