name: STAR 7 WORLD OTT - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 installed successfully."

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        shell: bash
        run: |
          echo "Checking STAR 7 project files..."

          files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/assets/index.html"
            "app/src/main/assets/Star 7_20260922_160312_0001.png"
            "app/src/main/java/com/star7/worldott/MainActivity.java"
          )

          missing=0

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "ERROR: Some required files are missing."
            exit 1
          fi

          echo "All project files found!"

      - name: Prepare STAR 7 App Icon
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/drawable

          cp "app/src/main/assets/Star 7_20260922_160312_0001.png" \
             "app/src/main/res/drawable/app_icon.png"

          echo "STAR 7 app icon prepared."

      - name: Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload STAR 7 APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR7-WORLD-OTT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
